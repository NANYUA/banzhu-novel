# D10 已定：静态规则，接进 CI 后 --strict 会让违规导致构建失败
disabled_rules:
  # ── 以下交给 SwiftFormat，避免两个工具互相打架 ──
  - trailing_whitespace      # 交给 SwiftFormat
  - line_length              # 交给 SwiftFormat（已设 maxwidth）
  - trailing_newline         # 交给 SwiftFormat
  - trailing_comma           # ⚠️ 与 SwiftFormat 的 trailingCommas 规则**直接冲突**
                             #   （SwiftLint 要求不要尾逗号，SwiftFormat 要求加）
                             #   格式统一由 SwiftFormat 独家负责，此处必须关掉
  - multiple_closures_with_trailing_closure
                             # ⚠️ 与 SwiftFormat 的 trailingClosures 规则**直接冲突**：
                             #   TCA 的 WithViewStore(store, observe: {...}) { content }
                             #   是官方推荐写法，SwiftFormat 会强制它变回尾闭包。
                             #   格式由 SwiftFormat 独家决定，此处关掉这条 lint。

opt_in_rules:
  # ⚠️ 本块注释一律写明「warning / error」**两档**阈值（数值见下方同名配置块）：
  #   CI 用 --strict 跑 ⇒ **warning 也会让构建失败**，真正的门槛是 warning 那档，不是 error 那档。
  - force_unwrapping        # 🔴 禁止 ! —— 定时炸弹
  - function_body_length     # 函数：warning 50 行 / error 60 行（花括号行、纯注释行、空行不计）
  - type_body_length         # 类型：warning 250 行 / error 300 行（不统计 extension）
  - cyclomatic_complexity   # 圈复杂度：warning 10 / error 15
  - identifier_name          # 名称不能太短：min_length 2
  - todo                     # 🔴 禁止遗留 TODO —— 防"临时放着忘了"
  - file_length              # 文件：warning 600 行 / error 900 行（全行计数，注释行也算）
  - large_tuple              # 元组：warning 3 个元素 / error 4 个元素

# ⚠️ 两档阈值都在这里：--strict 下 **warning 那档就会让 CI 失败**，别只盯着 error。
file_length:
  warning: 600
  error: 900

function_body_length:
  warning: 50
  error: 60

type_body_length:
  warning: 250
  error: 300

cyclomatic_complexity:
  warning: 10
  error: 15

large_tuple:
  warning: 3
  error: 4

identifier_name:
  min_length: 2
  excluded:
    - id
    - to
    - up
    - no

# SwiftLint 0.65.1 移除了内置 no_prints 规则，用等价自定义规则继续拦截调试输出。
custom_rules:
  no_print:
    name: No Print
    regex: '\b(?:print|debugPrint)\s*\('
    match_kinds:
      - identifier
    message: 禁止在正式代码中使用 print / debugPrint
    severity: error

excluded:
  # 与 .swiftformat 的 --exclude 保持一致：
  # 冻结的引擎快照（只读，T2 正式移植时才改造）+ Demo（保留作参考、不运行）
  # ⚠️ 测试目录不排除 —— 测试代码是我们自己写的，应当受同样的规则约束
  - Packages/NovelEngine/Sources
  - Demo
  - .build
