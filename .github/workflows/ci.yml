name: CI

# 🔒 核心原则：任何一道关卡不过 → 整个构建失败 → 发不出包。
#    本地检查可以 --no-verify 绕过，**只有 CI 跳不过**。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_package:
        description: Run unsigned package job
        required: false
        default: false
        type: boolean

jobs:
  verify:
    name: 编译 / 测试 / Lint / 架构校验
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      # ── 关卡 0：架构约束（放在最前，架构违规没必要浪费编译时间）────
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 架构约束校验
        run: sh scripts/check-architecture.sh

      # ── 环境 ──────────────────────────────────────────────────
      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 安装 SwiftFormat / SwiftLint
        run: brew install swiftformat swiftlint

      # ── 关卡 1：格式 ───────────────────────────────────────────
      - name: 格式校验（SwiftFormat）
        run: |
          swiftformat .
          if ! git diff --quiet; then
            echo "❌ 以下文件不符合 SwiftFormat。"
            echo "⬇️ 下面是【已格式化后的完整文件内容】，照此替换本地文件即可："
            for f in $(git diff --name-only); do
              echo "@@@@@ FILE:$f @@@@@"
              cat "$f"
              echo "@@@@@ ENDFILE:$f @@@@@"
            done
            exit 1
          fi

      # ── 关卡 2：静态规则 ───────────────────────────────────────
      - name: 静态检查（SwiftLint）
        run: swiftlint lint --strict --reporter github-actions-logging

      # ── 生成工程 ──────────────────────────────────────────────
      - name: 生成 Xcode 工程
        run: |
          xcodegen generate
          if [ -d Demo/PaginationDemo ]; then
            cd Demo/PaginationDemo && xcodegen generate && cd ../..
          else
            echo "⏭️  Demo/PaginationDemo 不存在，跳过"
          fi

      # ── 关卡 3：编译 ───────────────────────────────────────────
      # ⚠️ 两个开关缺一不可（Xcode 16.4 / macos-15 实测）：
      #    1) `-skipMacroValidation`：跳过 "Macro must be enabled" 指纹信任
      #    2) `-skipPackagePluginValidation`：跳过包插件（宏插件）的沙盒执行校验
      #       实测：光加 1）依然报 "malformed response / could not be found"，
      #            这俩是两层独立的门。详见
      #       https://forums.swift.org/t/ignore-macro-validation-using-xcodebuild-command/69033
      #    TCA 及其 5 个依赖全带宏插件，App 编译关卡必须两个都加。
      #    注：`swift test`（关卡 4）走 SwiftPM，不经过 Xcode 插件机制，无需这两个开关。
      - name: 编译 App（不签名）
        id: build
        run: |
          set -o pipefail
          xcodebuild \
            -project BanzhuNovel.xcodeproj \
            -scheme BanzhuNovel \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: 输出编译错误
        if: always() && steps.build.outcome == 'failure'
        run: |
          if [ -f build.log ]; then
            grep -E "error: |fatal error: " build.log | head -n 30 | while IFS= read -r line; do
              echo "::error title=Xcode::$line"
            done
          fi

      # ── 关卡 4：单元测试 ───────────────────────────────────────
      - name: 单元测试（XCTest）
        id: test
        run: |
          set -o pipefail
          swift test --package-path Packages/NovelCore 2>&1 | tee test-core.log
          swift test --package-path Packages/NovelEngine 2>&1 | tee test-engine.log

      - name: 输出测试错误
        if: always() && steps.test.outcome == 'failure'
        run: |
          for log in test-core.log test-engine.log; do
            if [ ! -f "$log" ]; then
              continue
            fi
            matches=$(grep -E "error:|fatal error:|Test Case .* failed|XCTAssert|failed -|XCTFailureError" "$log" || true)
            if [ -z "$matches" ]; then
              matches=$(tail -n 40 "$log")
            fi
            while IFS= read -r line; do
              echo "::error title=XCTest::$line"
            done <<< "$matches"
          done

      - name: 结果
        run: echo "✅ 全部关卡通过"

  package-unsigned:
    name: 打包未签名 iOS App
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.run_package
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 构建 Release App（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project BanzhuNovel.xcodeproj \
            -scheme BanzhuNovel \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/BanzhuNovelDerivedData" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee package-build.log

      - name: 输出打包错误
        if: failure()
        run: |
          if [ -f package-build.log ]; then
            grep -E "error: |fatal error: " package-build.log | head -n 30 | while IFS= read -r line; do
              echo "::error title=Xcode::$line"
            done
          fi

      - name: 制作 IPA / App
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/BanzhuNovelDerivedData/Build/Products/Release-iphoneos" \
            -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          APP_NAME="$(basename "$APP_PATH" .app)"

          mkdir -p artifacts/Payload
          cp -R "$APP_PATH" artifacts/Payload/
          (
            cd artifacts
            zip -qry "${APP_NAME}-unsigned.ipa" Payload
          )
          rm -rf artifacts/Payload

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "artifacts/${APP_NAME}-unsigned.app.zip"
          shasum -a 256 artifacts/* > artifacts/SHA256SUMS.txt
          ls -lh artifacts

      - name: 上传未签名构建产物
        uses: actions/upload-artifact@v4
        with:
          name: BanzhuNovel-unsigned-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
