name: BanzhuNovel          # ASCII：工程/Scheme 名，CI 引用它

options:
  bundleIdPrefix: com.example.novelreader
  deploymentTarget:
    iOS: "17.0"          # D5 已定：SwiftData 的硬门槛
  createIntermediateGroups: true

packages:
  NovelEngine:
    path: Packages/NovelEngine
  NovelCore:
    path: Packages/NovelCore

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  BanzhuNovel:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    dependencies:
      # 🔒 依赖方向：App → NovelCore → NovelEngine（单向）
      - package: NovelCore
      - package: NovelEngine
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Novel Reader
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO